# SonarQube Project Configuration
sonar.projectKey=capstone-microservices
sonar.projectName=DevOps Capstone Store
sonar.projectVersion=1.0

sonar.sources=app
sonar.sourceEncoding=UTF-8

# Exclude dependencies and tests from coverage requirements
sonar.exclusions=**/node_modules/**,**/venv/**,**/*.test.js,**/test_*.py
sonar.tests=app
sonar.test.inclusions=**/*.test.js,**/test_*.py
