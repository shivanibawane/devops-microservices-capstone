version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PRODUCTS_SERVICE_URL=http://products-service:5001
      - CART_SERVICE_URL=http://cart-service:5002
    depends_on:
      - products-service
      - cart-service
    restart: unless-stopped

  products-service:
    build:
      context: ./products-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    restart: unless-stopped

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    restart: unless-stopped

networks:
  default:
    name: capstone-network
